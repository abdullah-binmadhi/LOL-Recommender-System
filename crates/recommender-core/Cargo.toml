[package]
name = "recommender-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Typed, offline champion recommendation contracts and parity-preserving scoring core"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lol-scoring-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
