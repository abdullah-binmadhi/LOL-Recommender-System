[package]
name = "recommender-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Leptos client-side Rust preview for the champion recommender"

[dependencies]
js-sys = "0.3"
leptos = { version = "=0.8.22", features = ["csr"] }
recommender-core = { path = "../recommender-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "KeyboardEvent",
    "Storage",
    "Url",
    "Window",
] }
